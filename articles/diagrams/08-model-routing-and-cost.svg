f" font-size="13">4</text><text x="82" y="299" fill="#162333" font-family="system-ui,sans-serif" font-size="16">Quality evaluation</text><path d="M220 323 v17 m-5 -5 5 5 5 -5" stroke="#087d78" fill="none" stroke-width="2"/><rect x="25" y="346" width="390" height="58" rx="10" fill="#ffffff" stroke="#bccfd9"/><circle cx="52" cy="375" r="15" fill="#087d78"/><text x="52" y="380" text-anchor="middle" fill="white" font-family="system-ui,sans-serif" font-size="13">5</text><text x="82" y="381" fill="#162333" font-family="system-ui,sans-serif" font-size="16">Cost and latency ledger</text></svg>